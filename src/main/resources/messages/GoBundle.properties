dataViews.integers=Show integers as:
dataViews.integers.comment=Decimal is what delve prints: an unsigned value also gets <code>= 0x…</code>
dataViews.integers.DECIMAL=Decimal
dataViews.integers.HEXADECIMAL=Hexadecimal
dataViews.integers.BINARY=Binary
dataViews.integers.BOTH=Decimal and hexadecimal
dataViews.pointers=Show pointer addresses
dataViews.pointers.comment=Off: a pointer delve did not follow, <code>(*main.Node)(0xc000012345)</code>, is shown as <code>*main.Node</code>
dataViews.stringView=Enable String() view
dataViews.stringView.comment=A value of a type with a <code>String()</code> method shows what it returns. Each such value is a function call in the stopped program, so only in the top frame

# Settings | Go | Smart Completion (builds with the ML models only)
ml.enabled=Rank completion candidates with the ML model
ml.enabled.comment=A language model of Go code and a ranker trained on real completion lists order the popup; off: the deterministic order (expected type, scope, name)
ml.modelDirectory=Models directory:
ml.modelDirectory.comment=A directory with <code>lm.cml</code> and <code>rank.cml</code> of the ranker and/or <code>go-nn-31m-e2.cml</code> and <code>go-16384.bpe</code> of the network from a newer training; empty: the models bundled in the plugin
ml.status=Models:
ml.inline.group=Grey text (inline completion)
ml.inline.enabled=Suggest the rest of the line as grey text
ml.inline.enabled.comment=The bundled Go model proposes the end of the line after the caret; Tab accepts
ml.inline.threshold=Confidence threshold:
ml.inline.threshold.comment=From 0.50 to 0.99: higher shows fewer, more certain suggestions
ml.inline.dotThreshold=Confidence threshold after a dot:
ml.inline.dotThreshold.comment=Right after <code>.</code> the model names the member as well as elsewhere but is less sure: 0.5 shows half of such positions with 92 % exact lines (0.7: 37 % at 96 %)
ml.inline.showClosers=Show suggestions that are only closing brackets
ml.inline.showClosers.comment=Off: a suggestion made only of <code>)</code>, <code>]</code>, <code>}</code> is hidden
ml.inline.guessStrings=Guess the text inside string literals
ml.inline.guessStrings.comment=The confidence gate counts the code only, so <code>fmt.Errorf("…")</code> comes with a guessed message; off: the whole line must be certain
ml.inline.inStrings=Suggest inside string literals
ml.inline.inStrings.comment=On: log and error messages, format strings — the model continues them like code; right after the closing quote it is code anyway
ml.inline.inComments=Suggest inside comments
ml.inline.inComments.comment=Off: with the caret inside a comment the model is not asked (it would guess prose); the line after the comment is code again
ml.inline.emptyLineThreshold=Confidence threshold on an empty line:
ml.inline.emptyLineThreshold.comment=After Enter the whole statement is a guess (<code>return nil</code> after <code>if … {</code> is near 0.3): lower than the main threshold shows it
ml.inline.debugLog=Log every answer of the network
ml.inline.debugLog.comment=Text, confidence, threshold and whether it was shown, for each call — in Go | Plugin Logs (category <code>ml</code>)
ml.nnStatus=Network:
ml.showMarker=Mark the suggestions ordered by the model
ml.showMarker.comment=A grey <code>ML</code> after every row the model scored; off: no visible difference
ml.acceptanceWeight=Weight of accepted items
ml.acceptanceWeight.comment=What the memory of accepted items (Editor and Completion page) adds to the model's score: weight × ln(1 + acceptances). 0.3: three acceptances turn a close call, not a clear one; 0 turns the bonus off
