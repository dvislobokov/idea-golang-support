debugger.binaryDirectory.chooser=Directory of Debug Binaries
debugger.binaryLocation.TEMP=System temp directory
debugger.binaryLocation.PACKAGE=Package directory
debugger.binaryLocation.CUSTOM=Custom directory
debugger.dumpViaDelve=Dump goroutines via delve attach
debugger.dumpViaDelve.comment=Run | Dump Goroutines: delve attaches for a moment and the program runs on. Off: SIGQUIT, the program prints the dump to its console and exits. Windows has no SIGQUIT, so there it is always delve
