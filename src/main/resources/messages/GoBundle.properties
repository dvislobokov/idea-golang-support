# Settings | Go | Language Server
pluginData.group=Plugin data
pluginData.directory=Plugin data directory:
pluginData.comment=Delve built by the plugin, tools installed from this page, the symbol catalogue and temporary builds of go run / go test. Programs must be allowed to run there (on some Linux machines only under /home/work/<user>). Empty: the system directory of the IDE, or /home/work/<user>@<domain>/.cache/go-support when programs cannot run there. Changing it moves the files.
pluginData.notExecutable.title=Go plugin cannot run programs in its data directory
pluginData.notExecutable.text=Programs cannot be started from {0} ({1}). The debugger and the tools the plugin builds or installs will not work. Choose a directory where programs may run.
pluginData.use=Use {0}
pluginData.choose=Choose Directory…
pluginData.moving=Moving Go plugin data
pluginData.moved=Go plugin data is now in {0}
pluginData.refused=Programs cannot be started from {0} ({1}); the plugin data stays where it was.
ls.enabled=Use gopls for errors, completion, navigation and refactorings
ls.staticcheck=Staticcheck analyzers
ls.gofumpt=Format with gofumpt, a stricter gofmt
ls.inlayHints=Inlay hints: parameter names, types of variables, values of constants
ls.inlayHints.comment=The hints of gopls. With Language features: Built-in the IDE shows its own: Settings | Editor | Inlay Hints | Go
ls.highlightUsages=Highlight the usages of the name at the caret and the exit points of a function
ls.highlightUsages.comment=Reads and writes in their colours; on <code>func</code> or <code>return</code> — every <code>return</code> of the function
ls.trace=Log every message of the protocol
ls.trace.comment=<code>-rpc.trace</code> in the log window of gopls (menu Go | gopls | Show Log); big
ls.debugPages=Serve the debug pages of gopls
ls.debugPages.comment=Sessions, memory, metrics and the RPC log of the server in a browser (menu Go | gopls | Open Debug Pages)
ls.more=Every other setting of the server: the <b>gopls</b> page under this one. What is set there wins over these switches
features.group=Source of features
features.source=Language features:
features.source.comment=What answers in the editor: the language server, or the built-in analysis of the plugin — syntax errors, navigation, usages, completion, documentation and parameter info, diagnostics, semantic colours, rename, code vision, code actions. Built-in works without gopls; while the IDE indexes, a built-in feature that needs the indexes yields to gopls. The formatter is chosen on the Formatting page.

