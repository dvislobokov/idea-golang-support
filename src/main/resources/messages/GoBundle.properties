# what each tool is for (GoTool has the same texts in English in the code)
tool.gopls.purpose=Language server: errors, completion, navigation, refactorings
tool.dlv.purpose=Debugger behind the Debug button
tool.golangci-lint.purpose=Linter: warnings in the editor
