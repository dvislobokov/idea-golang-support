# The texts of the settings pages, English. The Russian ones are in GoBundle_ru.properties, with the same keys (GoBundleTest checks
# both ways). {0}, {1} are replaced as they are: an apostrophe is an apostrophe, nothing to double.
# The options of gopls have their English texts in the catalogue of the server itself (gopls api-json), not here.

