debugger.binaryIn=Build debug binaries in:
debugger.binaryIn.comment=The <code>__debug_bin…</code> delve builds for a session: in the temp directory of the system (nothing is left in the project), next to the sources as <code>dlv debug</code> does, or in a directory of your own. Deleted when the session ends
debugger.binaryDirectory=Directory:
