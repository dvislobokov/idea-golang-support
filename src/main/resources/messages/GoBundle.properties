# Settings | Go | Editor and Completion
editor.group=Editor
editor.docComments=Start a doc comment with the name of the declaration
editor.docComments.comment=<code>//</code> typed on an empty line right above <code>func</code>, <code>type</code>, <code>var</code> or <code>const</code> becomes <code>// Name </code>
editor.goplsActions=Show the actions of gopls in the list of Alt+Enter
editor.goplsActions.comment=Extract variable, Inline call, Invert if, Add test and others, for the caret or the selection. Off: they are behind <b>Refactorings and actions of gopls...</b>
editor.latin=Type Latin characters in code when the keyboard layout is Russian
editor.latin.comment=<code>аьеюЗкштедт</code> is typed as <code>fmt.Println</code>. Strings, runes and comments keep what is typed
editor.askBeforePlayground=Ask before sharing in Go Playground
editor.askBeforePlayground.comment=Share in Playground and Run in Playground (Tools | Go Tools) send the selection or the file to play.golang.org; the confirmation says so first
editor.idioms=Suggest the idiomatic next line as grey text (Tab to accept)
editor.idioms.comment=<code>if err != nil { return ... }</code> after an assigned error, with the return values of the function and the error wrapped where the file wraps its errors; <code>defer cancel()</code>, <code>defer mu.Unlock()</code>, <code>defer f.Close()</code>, <code>defer span.End()</code> after what needs them; the loop of a scanner and the error after it; the answer of an HTTP handler and the status of a gRPC method; the receiver after <code>func (</code>; the tag of a field as the fields above have it
editor.suggestions=Suggest code from context as grey text (Tab to accept)
editor.suggestionColors=Colour grey-text suggestions like code
editor.suggestionColors.comment=Keywords, strings, calls, types and variables of the grey text in the colours of the editor scheme, faded towards the background so that it still reads as a suggestion. Off: the plain grey of the IDE
editor.palette=Go color palette:
editor.palette.comment=Colors only Go and go.mod on top of the current color scheme: the background and the other languages stay. Dark or light variant follows the background of the scheme. Preview: Go | Go Color Palette...
palette.default=IDE default
editor.suggestions.comment=The right side of <code>arr := </code> from the uses below (<code>make([]string, 0, len(keys))</code>), the arguments of a call and the fields of a literal from the variables in scope, the values of <code>return</code>, what to range over, the body of a constructor, getter or setter. One suggestion, only when it is sure; the imports it needs are added on accept

completion.group=Completion
completion.returnValues=Offer the values of a return statement as one item
completion.returnValues.comment=<code>nil, err</code> after <code>return</code> inside <code>if err != nil</code>: the zero values of the results of the function, and the error
completion.prefixFirst=Names that begin with what is typed go first
completion.prefixFirst.comment=gopls matches fuzzily and orders by its own score: <code>ni</code> gives <code>net.IP</code> above <code>nil</code>. Off: the order of gopls
completion.byType=Show the values of the expected type in bold
completion.byType.comment=An argument of a call, a value of <code>return</code>, of a typed <code>var</code>. Smart completion (Ctrl+Shift+Space) leaves only such values. Needs gopls
completion.catalogue=Offer functions and types of packages by their names
completion.catalogue.comment=<code>Printl</code> gives <code>fmt.Println</code>, with the import: the standard library and the modules go.mod requires directly. Read once for a version, works without gopls
completion.unimported=Offer packages that are not imported
completion.unimported.comment=By the name of the package: <code>htt</code> gives <code>http</code> of <code>net/http</code>, and the import is written when it is chosen. Needs gopls
completion.structBraces=Write the braces of a literal after a struct type
completion.structBraces.comment=Where a value is expected: <code>c := http.Client{}</code>, caret between the braces, ready for Fill All Fields. Needs gopls
completion.keywords=Offer what a keyword can begin
completion.keywords.comment=<code>ty</code> at the top of a file gives <code>type Name struct {...}</code>, <code>fo</code> in a body gives <code>for i, x := range xs</code> for the slices in sight; Tab walks the stops. Works without gopls
completion.values=Offer HTTP status constants and time layouts
completion.values.comment=<code>404</code> in <code>WriteHeader</code>, <code>http.Error</code> or a comparison with <code>StatusCode</code> gives <code>http.StatusNotFound</code>; inside the string of <code>time.Parse</code> or <code>Format</code> — the layouts and their parts
completion.arguments=Offer the arguments of a completed call
completion.arguments.comment=The parameters are shown above the caret and the list opens for the first argument, then after every <code>, </code>. Needs gopls
completion.mapping=Offer field-to-field copies
completion.mapping.comment=In a struct literal and on a line after <code>dst.Name = src.Name</code>: one item per remaining field with the value in scope that fits it by type and name (<code>Email: u.Profile.Email</code>), and <b>Map all remaining fields from src</b> for every confident match at once. Marked <code>map</code>. Works without gopls
completion.importStats=Order imports by corpus statistics
completion.importStats.comment=When several packages fit an unresolved name (<code>rand</code>: <code>crypto/rand</code> or <code>math/rand</code>, <code>Client</code>), the import fix and the unimported items of the completion list put first the one that files with the same imports usually take (<code>crypto/rand</code> next to <code>crypto/sha256</code>, <code>math/rand</code> next to <code>time</code>). Only orders what the project and GOROOT provide. Needs the statistics file of the ML build or of the model directory; without it nothing changes
completion.acceptance=Learn from what I accept
completion.acceptance.comment=Items chosen before in this project go up in the lists of the same kind of position (after a dot, in an argument, at a statement start). Kept in the workspace of the project, not in <code>.idea</code>; the counts are halved every month
completion.acceptance.reset=Reset Memory

# Settings | Go | Formatting and Linters (the keys are of the former Code Quality page)
quality.formatter=Reformat Code with:
quality.formatOnSave=Format Go files on save
quality.formatOnSave.comment=With the formatter above; goimports also adds and removes imports. A file with a syntax error is saved as it is
quality.project.group=Project analysis
quality.project=Analyse the whole project in the background
quality.project.comment=Every problem of the Go and go.mod inspections in all Go files of the project, in the Project Errors tab of the Problems tool window; updated a moment after you stop typing, for the edited file and the packages that import it. Skips vendor, testdata, <code>.</code>/<code>_</code> directories, generated files and directories without Go files; pauses in Power Save Mode. Go | Reanalyse Project Problems runs a full pass
quality.project.warnings=Include warnings (off: errors only)
quality.golangci.group=golangci-lint
quality.golangci=Use golangci-lint (optional)
quality.golangci.comment=Off by default: the built-in inspections are the analysis of the plugin. On: golangci-lint warnings in the editor for saved files, with the <code>.golangci.yml</code> of the repository, run for the package of the file; <code>golangci-lint fmt</code> among the formatters; the tool among the missing ones at project open
quality.vulncheck.group=govulncheck
quality.vulncheck=Check for vulnerabilities with govulncheck
quality.vulncheck.comment=Off by default: govulncheck downloads the Go vulnerability database. On: <code>govulncheck -json ./...</code> runs in the background for every module at project open, a moment after go.mod / go.sum change and at most hourly otherwise; the result is kept per module. Vulnerable imports and calls are marked by the inspections GoVulnerablePackageImport and GoVulnerableCodeUsages (the second is off by default). Go | Check Vulnerabilities runs it at once. The tool path and its installation are on the Tools page
quality.linters.group=Custom linters
quality.linters.name=Name
quality.linters.commandLine=Command line
quality.linters.enabled=Enabled
quality.linters.trigger=Run
quality.linters.directory=Working directory
quality.linters.format=Output format
quality.linters.comment=A linter of your own that prints a golangci-lint JSON report or SARIF 2.1.0 on stdout. Macros: <code>$FilePath$</code>, <code>$FileDir$</code>, <code>$ModuleDir$</code>, <code>$Package$</code> (the package pattern from the working directory: <code>./store</code> or <code>.</code>), <code>$ImportPath$</code>. Saved files only: the tool reads the disk. A finding shows as <code>[name] message</code>, with Suppress with <code>//nolint:name</code>; a failure goes to the plugin log and, once, to a balloon
quality.linters.timeout=Linter timeout, seconds:
lint.trigger.ON_SAVE=On save
lint.trigger.AFTER_SAVE=On the fly, saved files
lint.directory.MODULE_ROOT=Module root
lint.directory.FILE_DIRECTORY=File directory
lint.format.GOLANGCI_JSON=golangci JSON
lint.format.SARIF=SARIF 2.1.0

