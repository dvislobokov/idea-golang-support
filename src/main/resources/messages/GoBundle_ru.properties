paste.json.comment=Объект JSON, вставленный между объявлениями, становится типами Go, после <code>type Name</code> типом структуры, внутри структуры её полями
pasteJson.ASK=Спрашивать
pasteJson.CONVERT=Преобразовывать в тип Go
pasteJson.AS_IS=Вставлять как есть
