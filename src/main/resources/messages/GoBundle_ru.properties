buildTags.toolchain=Cgo и эксперименты
buildTags.cgo=Поддержка cgo:
buildTags.cgo.comment=Выполняется ли тег сборки <code>cgo</code> в анализе; команды go плагина (сборка, запуск, тесты, vet, отладчик) получают <code>CGO_ENABLED</code>. По умолчанию — как говорит <code>go env</code>
buildTags.cgo.DEFAULT=По умолчанию
