buildTags.cgo.DISABLED=Выключена
buildTags.experiments=Эксперименты:
buildTags.experiments.comment=GOEXPERIMENT через запятую: <code>rangefunc</code>, <code>noswissmap</code>. В анализе выполняются теги <code>goexperiment.X</code> этих имён; команды go плагина получают их как GOEXPERIMENT. Пусто — решает окружение
buildTags.experiments.choose=Выбрать…
buildTags.experiments.title=GOEXPERIMENT
buildTags.experiments.hint=Эксперименты установленного Go ({0}). Отмечено — включено. По умолчанию — как в toolchain; записываются только отличия.
buildTags.experiments.default=включён по умолчанию
buildTags.experiments.platform=включён по умолчанию на большинстве платформ
buildTags.experiments.none=Исходники установленного Go не найдены: впишите имена в поле.
buildTags.experiments.invalid=Не имя эксперимента: {0}
autoImport.group=Go
autoImport.popup=Показывать подсказку импорта
autoImport.unambiguous=Добавлять однозначные импорты на лету
autoImport.unambiguous.comment=Для неопределённого <code>strings.ToUpper</code>, которому подходит ровно один пакет, <code>import "strings"</code> пишется без Alt+Enter
autoImport.optimize=Оптимизировать импорты на лету
autoImport.optimize.comment=Неиспользуемые импорты удаляются, когда других проблем в файле нет и курсор не в импортах
autoImport.exclude=Не предлагать для импорта и в автодополнении:
autoImport.exclude.comment=По пути импорта в строке; <code>/...</code> или <code>/*</code> в конце захватывает и подпакеты. Уже импортированный пакет дополняется как обычно
imports.autoImport=Импорты на лету, подсказка импорта и исключённые пакеты: Settings | Editor | General | Auto Import, Go. Как раскладывает импорты Optimize Imports: Settings | Editor | Code Style | Go, Imports
printf.group=Функции, подобные printf
printf.extra=Проверять как printf:
printf.extra.comment=Полные имена, как пишет go vet, по одному в строке: <code>example.com/log.Infof</code>, <code>(*example.com/log.Logger).Infof</code>. Alt+Enter на вызове: Mark as string formatting function
printf.excluded=Не проверять:
printf.excluded.comment=Функции, подобные printf (известные или найденные как обёртки), вызовы которых не проверяются. Alt+Enter на вызове: Exclude string formatting function
