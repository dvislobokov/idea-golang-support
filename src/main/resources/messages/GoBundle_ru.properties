ls.inlayHints=Подсказки в коде: имена параметров, типы переменных, значения констант
ls.inlayHints.comment=Подсказки gopls. При «Language features: Built-in» их показывает сама IDE: Settings | Editor | Inlay Hints | Go
ls.highlightUsages=Подсвечивать использования имени под курсором и точки выхода функции
ls.highlightUsages.comment=Чтение и запись — своими цветами; на <code>func</code> или <code>return</code> — все <code>return</code> функции
ls.trace=Записывать в журнал каждое сообщение протокола
ls.trace.comment=<code>-rpc.trace</code> в окне журнала gopls (меню Go | gopls | Show Log); объёмно
ls.debugPages=Включить служебные страницы gopls
ls.debugPages.comment=Сессии, память, метрики и журнал RPC сервера в браузере (меню Go | gopls | Open Debug Pages)
ls.more=Все остальные настройки сервера — на странице <b>gopls</b> ниже. Заданное там важнее этих переключателей
features.group=Источник возможностей
features.source=Возможности языка:
features.source.comment=Кто отвечает в редакторе: сервер языка или встроенный анализ плагина — синтаксические ошибки, навигация, использования, автодополнение, документация и параметры, диагностики, семантические цвета, переименование, code vision, действия над кодом. Встроенный анализ работает без gopls; пока IDE индексирует, встроенная возможность, которой нужны индексы, уступает gopls. Форматтер выбирается на странице Formatting.

debugger.globals=Показывать глобальные переменные пакета
debugger.hideSystem=Скрывать системные горутины
debugger.hideSystem.comment=Горутины рантайма: сборщик мусора, финализаторы, планировщик
debugger.stackDepth=Глубина стека:
debugger.anyGoVersion=Отлаживать программы на версии Go, которую этот delve не поддерживает
debugger.anyGoVersion.comment=<code>--check-go-version=false</code>. Обычно работает; надёжнее поставить delve под свой toolchain
debugger.log=Писать журнал delve для каждой сессии отладки
debugger.log.comment=Меню Go | Show Debugger Logs
debugger.binaryIn=Собирать отладочный бинарь:
debugger.binaryIn.comment=Куда delve кладёт собранный для сессии <code>__debug_bin…</code>: во временный каталог системы (в проекте ничего не остаётся), рядом с исходниками, как делает <code>dlv debug</code>, или в свой каталог. После сессии файл удаляется
debugger.binaryDirectory=Каталог:
debugger.binaryDirectory.comment=Относительный путь считается от каталога пакета: <code>build</code>, <code>../bin</code>
debugger.binaryDirectory.chooser=Каталог отладочных бинарей
debugger.binaryLocation.TEMP=Во временный каталог системы
debugger.binaryLocation.PACKAGE=В каталог пакета
debugger.binaryLocation.CUSTOM=В свой каталог
debugger.dumpViaDelve=Снимать дамп горутин через подключение delve
debugger.dumpViaDelve.comment=Run | Dump Goroutines: delve подключается на мгновение, программа работает дальше. Выключено: SIGQUIT, программа печатает дамп в свою консоль и завершается. В Windows SIGQUIT нет, там всегда delve
