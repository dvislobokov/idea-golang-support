modules.environment.invalid=Не ИМЯ=значение: {0}
modules.vendoring=Поддержка vendoring:
modules.vendoring.comment=Для модуля с <code>vendor/modules.txt</code>. Автоматически: как решит go (режим vendor с go 1.14). Всегда: <code>-mod=vendor</code>. Никогда: <code>-mod=mod</code>. Передаётся через GOFLAGS; <code>-mod</code> из вашего GOFLAGS важнее
modules.vendoring.AUTO=Автоматически
modules.vendoring.ALWAYS=Всегда
modules.vendoring.NEVER=Никогда
modules.download=Загружать зависимости модулей:
modules.download.comment=<code>go mod download</code> в фоне после сохранения go.mod с другими требованиями
modules.download.ALL=Для всех проектов
modules.download.NONE=Ни для одного проекта
modules.download.ONLY_THIS=Только для этого проекта
modules.download.ALL_BUT_THIS=Для всех проектов, кроме этого
editor.smartKeys=Форматирование блока по }, заготовка doc-комментария по Enter...
editor.smartKeys.comment=Галочки IDE, как в GoLand (Editor | General | Smart Keys): <code>}</code>, закрывающая блок, переформатирует блок встроенным форматтером; Enter после <code>//</code> над объявлением пишет <code>// Name </code>
dataViews.title=Go
dataViews.integers=Целые числа:
dataViews.integers.comment=Десятичные — как печатает delve: у беззнакового ещё и <code>= 0x…</code>
dataViews.integers.DECIMAL=Десятичные
dataViews.integers.HEXADECIMAL=Шестнадцатеричные
dataViews.integers.BINARY=Двоичные
dataViews.integers.BOTH=Десятичные и шестнадцатеричные
dataViews.pointers=Показывать адреса указателей
dataViews.pointers.comment=Без галочки указатель, по которому delve не прошёл, <code>(*main.Node)(0xc000012345)</code>, показывается как <code>*main.Node</code>
dataViews.stringView=Показывать результат String()
dataViews.stringView.comment=Значение типа с методом <code>String()</code> показывает то, что он возвращает. Каждое такое значение — вызов функции в остановленной программе, поэтому только в верхнем кадре

# Settings | Go | Smart Completion (только сборки с ML-моделями)
ml.enabled=Ранжировать варианты автодополнения ML-моделью
ml.enabled.comment=Языковая модель кода Go и ранкер, обученный на настоящих списках автодополнения, упорядочивают список; выкл.: детерминированный порядок (ожидаемый тип, область видимости, имя)
ml.modelDirectory=Каталог моделей:
ml.modelDirectory.comment=Каталог с <code>lm.cml</code> и <code>rank.cml</code> ранкера и/или <code>go-nn-31m-e2.cml</code> и <code>go-16384.bpe</code> сети из нового обучения; пусто: модели, встроенные в плагин
ml.status=Модели:
ml.inline.group=Серый текст (inline-подсказки)
ml.inline.enabled=Предлагать остаток строки серым текстом
ml.inline.enabled.comment=Встроенная модель Go предлагает конец строки после каретки; Tab принимает
ml.inline.threshold=Порог уверенности:
ml.inline.threshold.comment=От 0,50 до 0,99: чем выше, тем меньше подсказок, но они увереннее
ml.inline.dotThreshold=Порог уверенности после точки:
ml.inline.dotThreshold.comment=Сразу после <code>.</code> модель угадывает член не хуже, но менее уверена: 0,5 показывает половину таких позиций с 92 % точных строк (0,7: 37 % при 96 %)
ml.inline.bigModel=Большая модель (50 M)
ml.inline.bigModel.comment=65,7 % точных строк вместо 63,6 % при задержке примерно в 1,7 раза больше; переключение перезагружает сеть в фоне
ml.inline.bigModel.absent=В этой сборке только модель 31 M (<code>-Pml.big=true</code> добавляет 50 M); каталог моделей с <code>go-nn-50m-e3-lr2e3.cml</code> тоже подойдёт
ml.inline.showClosers=Показывать подсказки, состоящие только из закрывающих скобок
ml.inline.showClosers.comment=Выкл.: подсказка из одних <code>)</code>, <code>]</code>, <code>}</code> скрыта
ml.inline.guessStrings=Угадывать текст внутри строковых литералов
ml.inline.guessStrings.comment=Порог считается только по коду, и <code>fmt.Errorf("…")</code> приходит с угаданным сообщением; выкл.: уверенной должна быть вся строка
ml.inline.emptyLineThreshold=Порог уверенности на пустой строке:
ml.inline.emptyLineThreshold.comment=После Enter вся инструкция — догадка (<code>return nil</code> после <code>if … {</code> около 0,3): порог ниже основного показывает её
ml.inline.debugLog=Писать в лог каждый ответ сети
ml.inline.debugLog.comment=Текст, уверенность, порог и показана ли подсказка, на каждый вызов — в Go | Plugin Logs (категория <code>ml</code>)
ml.nnStatus=Сеть:
ml.showMarker=Помечать подсказки, упорядоченные моделью
ml.showMarker.comment=Серое <code>ML</code> после каждой строки, которую оценила модель; выкл.: никаких внешних отличий
ml.acceptanceWeight=Вес выбранных раньше пунктов
ml.acceptanceWeight.comment=Что память выбранных пунктов (страница «Редактор и автодополнение») прибавляет к оценке модели: вес × ln(1 + выборов). 0.3: три выбора решают спорный случай, но не явный; 0 выключает добавку
