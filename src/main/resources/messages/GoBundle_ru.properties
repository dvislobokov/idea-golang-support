pluginData.group=Данные плагина
pluginData.directory=Каталог данных плагина:
pluginData.comment=Собранный плагином delve, инструменты, установленные с этой страницы, каталог символов и временные сборки go run / go test. Запуск программ там должен быть разрешён (на некоторых Linux — только в /home/work/<пользователь>). Пусто: системный каталог IDE, а если программы там запускать нельзя — /home/work/<user>@<domain>/.cache/go-support. При смене файлы переносятся.
pluginData.notExecutable.title=Плагин Go не может запускать программы из своего каталога данных
pluginData.notExecutable.text=Программы из {0} не запускаются ({1}). Отладчик и инструменты, которые плагин собирает или ставит, работать не будут. Выберите каталог, где запуск разрешён.
pluginData.use=Использовать {0}
pluginData.choose=Выбрать каталог…
pluginData.moving=Перенос данных плагина Go
pluginData.moved=Данные плагина Go теперь в {0}
pluginData.refused=Программы из {0} не запускаются ({1}); данные плагина остались на прежнем месте.
