editor.group=Редактор
editor.docComments=Начинать док-комментарий с имени объявления
editor.docComments.comment=<code>//</code>, набранные на пустой строке прямо над <code>func</code>, <code>type</code>, <code>var</code> или <code>const</code>, превращаются в <code>// Имя </code>
editor.goplsActions=Показывать действия gopls в списке Alt+Enter
editor.goplsActions.comment=Extract variable, Inline call, Invert if, Add test и другие — для курсора или выделения. Без галочки они остаются в пункте <b>Refactorings and actions of gopls...</b>
editor.latin=Набирать латиницу в коде при русской раскладке
editor.latin.comment=<code>аьеюЗкштедт</code> вводится как <code>fmt.Println</code>. В строках, рунах и комментариях остаётся набранное
editor.askBeforePlayground=Спрашивать перед отправкой в Go Playground
editor.askBeforePlayground.comment=Share in Playground и Run in Playground (Tools | Go Tools) отправляют выделение или файл на play.golang.org; сначала об этом спрашивается
editor.idioms=Подсказывать следующую строку серым текстом (Tab — принять)
editor.idioms.comment=<code>if err != nil { return ... }</code> после присваивания ошибки — с результатами функции и обёрткой ошибки в том же виде, что в файле; <code>defer cancel()</code>, <code>defer mu.Unlock()</code>, <code>defer f.Close()</code>, <code>defer span.End()</code> после того, что их требует; цикл сканера и проверка ошибки после него; ответ HTTP-обработчика и статус gRPC-метода; получатель после <code>func (</code>; тег поля в том же виде, что у полей выше
editor.suggestions=Подсказывать код по контексту серым текстом (Tab — принять)
editor.suggestionColors=Раскрашивать серый текст как код
editor.suggestionColors.comment=Ключевые слова, строки, вызовы, типы и переменные подсказки — цветами схемы редактора, приглушёнными к фону, чтобы подсказку было видно как подсказку. Выключено — обычный серый цвет IDE
editor.palette=Палитра Go:
editor.palette.comment=Раскрашивает только Go и go.mod поверх текущей цветовой схемы: фон и другие языки не меняются. Тёмный или светлый вариант выбирается по фону схемы. Посмотреть вживую: Go | Go Color Palette...
palette.default=Как в IDE
editor.suggestions.comment=Правая часть <code>arr := </code> по тому, как имя используется ниже (<code>make([]string, 0, len(keys))</code>), аргументы вызова и поля литерала из переменных в области видимости, значения <code>return</code>, по чему идёт <code>range</code>, тело конструктора, геттера и сеттера. Одна подсказка и только когда она однозначна; нужные импорты добавляются при принятии

completion.group=Подсказки кода
completion.returnValues=Предлагать значения для return одним пунктом
completion.returnValues.comment=<code>nil, err</code> после <code>return</code> внутри <code>if err != nil</code>: нулевые значения результатов функции и сама ошибка
completion.prefixFirst=Имена, начинающиеся с набранного, идут первыми
completion.prefixFirst.comment=gopls сопоставляет нечётко и сортирует по своей оценке: по <code>ni</code> <code>net.IP</code> оказывается выше <code>nil</code>. Без галочки — порядок gopls
completion.byType=Выделять жирным значения ожидаемого типа
completion.byType.comment=Аргумент вызова, значение <code>return</code>, типизированный <code>var</code>. Smart completion (Ctrl+Shift+Space) оставляет только такие значения. Нужен gopls
completion.catalogue=Предлагать функции и типы пакетов по их именам
completion.catalogue.comment=<code>Printl</code> даёт <code>fmt.Println</code> вместе с импортом: стандартная библиотека и модули, которые go.mod требует напрямую. Читается один раз на версию, работает и без gopls
completion.unimported=Предлагать пакеты, которые не импортированы
completion.unimported.comment=По имени пакета: <code>htt</code> даёт <code>http</code> из <code>net/http</code>, импорт дописывается при выборе. Нужен gopls
completion.structBraces=Дописывать скобки литерала после типа-структуры
completion.structBraces.comment=Там, где ожидается значение: <code>c := http.Client{}</code>, курсор между скобками, сразу под Fill All Fields. Нужен gopls
completion.keywords=Предлагать заготовки по ключевому слову
completion.keywords.comment=<code>ty</code> в начале файла даёт <code>type Name struct {...}</code>, <code>fo</code> в теле — <code>for i, x := range xs</code> по срезам в области видимости; Tab переводит по местам ввода. Работает и без gopls
completion.values=Предлагать константы статусов HTTP и шаблоны времени
completion.values.comment=<code>404</code> в <code>WriteHeader</code>, <code>http.Error</code> или в сравнении со <code>StatusCode</code> даёт <code>http.StatusNotFound</code>; внутри строки <code>time.Parse</code> или <code>Format</code> — шаблоны и их части
completion.arguments=Предлагать аргументы после выбранного вызова
completion.arguments.comment=Параметры показываются над курсором, список открывается для первого аргумента и дальше после каждой <code>, </code>. Нужен gopls
completion.mapping=Предлагать копирование поля в поле
completion.mapping.comment=В литерале структуры и на строке после <code>dst.Name = src.Name</code>: по пункту на каждое незаполненное поле со значением из области видимости, подходящим по типу и имени (<code>Email: u.Profile.Email</code>), и <b>Map all remaining fields from src</b> — все уверенные совпадения разом. Помечены <code>map</code>. Работает без gopls
completion.acceptance=Учиться на том, что я выбираю
completion.acceptance.comment=Пункты, выбранные раньше в этом проекте, поднимаются в списках того же вида позиции (после точки, в аргументе, в начале оператора). Хранится в workspace проекта, не в <code>.idea</code>; счётчики делятся пополам каждый месяц
completion.acceptance.reset=Сбросить память

quality.formatter=Reformat Code выполняет:
quality.formatOnSave=Форматировать файлы Go при сохранении
quality.formatOnSave.comment=Форматтером, выбранным выше; goimports заодно добавляет и убирает импорты. Файл с синтаксической ошибкой сохраняется как есть
quality.project.group=Анализ проекта
quality.project=Анализировать весь проект в фоне
quality.project.comment=Все замечания проверок Go и go.mod по всем Go-файлам проекта — во вкладке Project Errors окна Problems; обновляются вскоре после того, как вы перестали печатать: для изменённого файла и пакетов, которые его импортируют. Пропускаются vendor, testdata, каталоги на <code>.</code>/<code>_</code>, сгенерированные файлы и каталоги без Go-файлов; в Power Save Mode анализ приостановлен. Полный проход — Go | Reanalyse Project Problems
quality.project.warnings=Включать предупреждения (выключено — только ошибки)
quality.golangci.group=golangci-lint
quality.golangci=Использовать golangci-lint (необязательно)
quality.golangci.comment=По умолчанию выключено: анализ кода плагина — встроенные инспекции. Включено: замечания golangci-lint в редакторе для сохранённых файлов, с <code>.golangci.yml</code> репозитория, по пакету файла; <code>golangci-lint fmt</code> среди форматтеров; инструмент в списке недостающих при открытии проекта
quality.vulncheck.group=govulncheck
quality.vulncheck=Проверять уязвимости через govulncheck
quality.vulncheck.comment=По умолчанию выключено: govulncheck скачивает базу уязвимостей Go. Включено: <code>govulncheck -json ./...</code> в фоне для каждого модуля при открытии проекта, вскоре после изменения go.mod / go.sum и не чаще раза в час в остальное время; результат хранится по модулю. Уязвимые импорты и вызовы отмечают инспекции GoVulnerablePackageImport и GoVulnerableCodeUsages (вторая по умолчанию выключена). Go | Check Vulnerabilities запускает проверку сразу. Путь к инструменту и установка — на странице Tools
quality.linters.group=Свои линтеры
quality.linters.name=Имя
quality.linters.commandLine=Командная строка
quality.linters.enabled=Включён
quality.linters.trigger=Запуск
quality.linters.directory=Рабочий каталог
quality.linters.format=Формат вывода
quality.linters.comment=Свой линтер, который печатает в stdout JSON-отчёт golangci-lint или SARIF 2.1.0. Макросы: <code>$FilePath$</code>, <code>$FileDir$</code>, <code>$ModuleDir$</code>, <code>$Package$</code> (шаблон пакета от рабочего каталога: <code>./store</code> или <code>.</code>), <code>$ImportPath$</code>. Только сохранённые файлы: инструмент читает диск. Замечание показывается как <code>[имя] текст</code>, с исправлением Suppress with <code>//nolint:имя</code>; сбой пишется в журнал плагина и один раз — в уведомление
quality.linters.timeout=Тайм-аут линтера, секунд:
lint.trigger.ON_SAVE=При сохранении
lint.trigger.AFTER_SAVE=На лету, сохранённые файлы
lint.directory.MODULE_ROOT=Корень модуля
lint.directory.FILE_DIRECTORY=Каталог файла
lint.format.GOLANGCI_JSON=golangci JSON
lint.format.SARIF=SARIF 2.1.0

