codeStyle.imports.localPrefixes=Импорты, начинающиеся с:
codeStyle.imports.localPrefixes.comment=Префиксы через запятую, как у <code>goimports -local</code> (передаются и goimports, когда он форматирует). Пусто: модули проекта
codeStyle.imports.oneDeclaration=Собирать все импорты в одно объявление
codeStyle.imports.removeAliases=Удалять лишние псевдонимы импортов
codeStyle.imports.comment=Применяется в Code | Optimize Imports. goimports: группы goimports; gofmt: сортировка внутри групп, написанных вручную; Нет: порядок сохраняется
codeStyle.wrapping.tab=Переносы и скобки
codeStyle.wrapping.arguments=Разбивать длинные аргументы вызова по строкам
codeStyle.wrapping.literals=Разбивать длинные элементы составного литерала по строкам
codeStyle.wrapping.parameters=Разбивать длинные параметры функции по строкам
codeStyle.wrapping.comment=По элементу в строке с запятой в конце, когда строка длиннее границы переноса. Применяется в Reformat Code со встроенным форматтером (Settings | Go | Formatting); gofmt и goimports строки не переносят
codeStyle.other.tab=Прочее
codeStyle.other.leadingSpace=Пробел в начале комментариев
codeStyle.other.leadingSpace.comment=Reformat Code (встроенный форматтер) ставит пробел; также включает инспекцию «Comment has no leading space» (Settings | Editor | Inspections | Go | Code style issues)
