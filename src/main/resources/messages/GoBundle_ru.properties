formatting.optimizeImportsOnSave=Оптимизировать импорты при сохранении
formatting.optimizeImportsOnSave.comment=Убирает неиспользуемые импорты и группирует остальные, как <code>goimports -local</code>, независимо от форматирования. Та же галочка есть в Settings | Tools | Actions on Save
actionsOnSave.optimizeImports=Оптимизировать импорты Go
modules.window=Окно Go Dependencies
modules.directFirst=Сначала прямые зависимости
modules.directFirst.comment=Требования модуля выше косвенных; выключено — порядок <code>go list -m</code>, по пути модуля. Действует при следующем Refresh
