goroot.inUse=Используется:
goroot.comment=Toolchain этого go — toolchain проекта: сборка, запуск, тесты, сервер языка и отладчик; в его GOROOT — стандартная библиотека, которую индексирует плагин. Другая версия Go: укажите в поле её go или поставьте её первой в PATH

gopath.comment=По данным <code>go env</code>; меняется командой <code>go env -w GOPATH=...</code>. Инструменты плагин ищет в PATH, в GOBIN и в GOPATH/bin; <code>go install</code> кладёт их в GOBIN
gopath.notSet=Не задан (go не найден)
gopath.gobin.default=Не задан: {0}

modules.group=Модули проекта
modules.comment=Режим vendor: есть <code>vendor/modules.txt</code>, согласованный с go.mod, пакеты читаются из vendor. По данным модели проекта; здесь это не меняется
modules.reading=Чтение...
modules.vendor={0}: каталог vendor
modules.cache={0}: кэш модулей
modules.none=В проекте нет go.mod

buildTags.target=Целевая платформа
buildTags.target.comment=Платформа, для которой работает встроенный анализ: какие файлы входят в пакет и какие строки <code>//go:build</code> выполняются. Тот же выбор, что у виджета GOOS/GOARCH в строке состояния; команды go и gopls берут окружение
buildTags.tags=Теги сборки
buildTags.default=По умолчанию ({0})

