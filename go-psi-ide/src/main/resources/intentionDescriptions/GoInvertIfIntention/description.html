<html><body>Negates the condition of an <code>if</code> with an <code>else</code> block and swaps the branches. Comparisons are flipped (<code>&lt;</code> to <code>&gt;=</code> only for integers and strings), <code>!x</code> becomes <code>x</code>, and a top-level <code>&amp;&amp;</code> / <code>||</code> follows De Morgan. Also available on the <code>else</code> keyword.</body></html>
