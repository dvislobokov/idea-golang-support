hints.parameters.name=Parameter names
hints.parameters.description=The names of the parameters at the arguments of a call: <code>f(/*name:*/ "x")</code>. Not shown when the argument already says the name, or when a function of one parameter says it by its own name.
hints.fields.name=Struct literal field names
hints.fields.description=The field names at the elements of a struct literal written without keys: <code>Point{/*X:*/ 1, /*Y:*/ 2}</code>.
hints.types.name=Types
hints.types.description=Types the code leaves out.
hints.types.assign.name=Variables declared with :=
hints.types.assign.description=The type of a variable declared with <code>:=</code>: <code>n/*: int*/ := len(s)</code>.
hints.types.range.name=Range variables
hints.types.range.description=The types of the variables of <code>for … range</code>: <code>for i/*: int*/, v/*: string*/ := range names</code>.
hints.types.literal.name=Elided literal types
hints.types.literal.description=The type of a nested literal whose type is left out: <code>[]Point{/*Point*/{1, 2}}</code>.
hints.types.instantiation.name=Inferred type arguments
hints.types.instantiation.description=The type arguments inferred for a call of a generic function: <code>Max/*[int]*/(a, b)</code>.
hints.constants.name=Constant values
hints.constants.description=The values of constants the source does not show: <code>iota</code> rows, repeated rows and expressions: <code>KindB/* = 1*/</code>.
hints.struct.name=Struct size and padding
hints.struct.description=The size of a struct type as the compiler lays it out for the GOARCH of the build (64-bit targets), the bytes lost to padding and the size with the fields reordered (Alt+Enter, Reorder fields): <code>type T struct { /*24 bytes, 8 padding (16 if reordered)*/</code>.
hints.time.name=Time layout example
hints.time.description=The layout of <code>Time.Format</code>, <code>time.Parse</code> and the like rendered with a fixed time: <code>t.Format("2006-01-02 15:04"/*&rarr; 2026-03-07 15:09*/)</code>.
