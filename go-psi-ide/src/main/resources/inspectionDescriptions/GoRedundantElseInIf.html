Reports an <code>else</code> after an <code>if</code> block that ends with <code>return</code>, <code>break</code>, <code>continue</code>, <code>goto</code> or <code>panic</code>: the <code>else</code> block can follow the <code>if</code> unindented. <code>else if</code> chains are not reported.
<pre><code>if err != nil {
    return err
} else {
    use(v)
}</code></pre>
<p>Quick fixes: <b>Remove redundant 'else' (when the if has no init statement)</b>.</p>
