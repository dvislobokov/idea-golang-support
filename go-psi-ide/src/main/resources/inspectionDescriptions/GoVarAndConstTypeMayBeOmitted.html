Reports the type of a <code>var</code> or <code>const</code> declaration that the values have anyway (for untyped constants of a <code>var</code>, their default type). A constant keeps its type for an untyped value: dropping it would make the constant untyped.
<pre><code>var s string = fmt.Sprint(x)
var n int = 1</code></pre>
