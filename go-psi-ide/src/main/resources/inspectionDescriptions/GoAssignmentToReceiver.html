Reports assignments to method receivers (<code>c = …</code>, <code>c++</code>, <code>c += …</code>). On a value receiver the assignment does not propagate to
other calls; on a pointer receiver it propagates only to callees but not to callers. Writes to fields (<code>c.Radius = r</code>) are not reported.
<pre><code>func (c Circle) Reset() {
    c = Circle{}
}</code></pre>
